name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install
        run: pip install --constraint requirements.lock -e ".[dev]"
      - name: Ruff
        run: ruff check .
      # Nothing is trained here. With no artifacts/model, the one test that needs the exported model skips.
      - name: Pytest
        run: pytest

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright, /predict mocked
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Inference image
        run: docker build --file infra/inference.Dockerfile --tag doodleverse-inference:ci .
      - name: Web image
        run: docker build --file infra/web.Dockerfile --tag doodleverse-web:ci apps/web
      # The inference image needs a model mounted to start, so only the web one is run.
      - name: Web image serves the page
        run: |
          docker run --detach --name web --publish 3000:3000 doodleverse-web:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1
      - name: Image sizes
        run: docker image ls --filter "reference=doodleverse-*"
