AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Doodleverse inference, the parts that outlive a deploy: the versioned model bucket, the image repository,
  the log group, and the three roles the Express Mode service runs with.

Resources:
  ModelBucket:
    Type: AWS::S3::Bucket
    # Old model versions stay restorable even if the stack is deleted.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub doodleverse-models-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ModelBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ModelBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ModelBucket.Arn
              - !Sub ${ModelBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: doodleverse-inference
      # Tags are commit hashes. A pushed tag always means the same image.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules": [{"rulePriority": 1, "description": "Keep the five newest images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5},
          "action": {"type": "expire"}}]}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /doodleverse/inference
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: doodleverse-inference-execution
      Description: Lets ECS pull the inference image and write its logs. Nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pull-image-write-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ImageRepository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: doodleverse-inference-task
      Description: What the inference code itself may do, which is read model files.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: read-models
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ModelBucket.Arn}/models/*

  InfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: doodleverse-ecs-infrastructure
      Description: Lets ECS Express Mode manage the load balancer, certificate, security groups, and scaling.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices

Outputs:
  ModelBucketName:
    Value: !Ref ModelBucket
    Export:
      Name: !Sub ${AWS::StackName}-ModelBucketName
  ImageRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-ImageRepositoryUri
  LogGroupName:
    Value: !Ref LogGroup
    Export:
      Name: !Sub ${AWS::StackName}-LogGroupName
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ExecutionRoleArn
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TaskRoleArn
  InfrastructureRoleArn:
    Value: !GetAtt InfrastructureRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-InfrastructureRoleArn
